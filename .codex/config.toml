# Codex 的项目级配置。
#
# 这是 Codex 唯一认的项目配置路径（.codex/config.toml，TOML 格式）。
#
# 代码风格**不写在这里**：Codex 不提供「tab 宽度」这类编辑器设置，它靠
# 仓库根目录的 AGENTS.md 里的项目指令来遵守。缩进的权威是
# scripts/format_check.pl（Perl 用 tab、shell 用 4 空格），
# 编辑器侧由 .editorconfig 落地。
#
# 留空 = 沿用用户级 ~/.codex/config.toml 的模型与审批设置。
# 需要固定时在这里显式写，例如：
#   model = "gpt-5.1"
