name: Bootstrap

# 在真 macOS 上跑一次完整的 ./bootstrap，把 essential 包编出来。
#
# 为什么在这里跑而不是在别的机器上：
#
#   1. dpkg / tar 用 --build=%m-apple-darwin 编译，产物是 Mach-O，链的是
#      macOS 的 libSystem。Linux 上编出来的是 ELF，装进 Mac 上一行都跑不起来
#      —— 所以那台 Ubuntu 22.04 的服务器只能当镜像，不能当构建机。
#   2. 种子里的 .deb 路径是写死的（--with-admindir=%p/...、dylib 的
#      install_name 是绝对路径），一台机器编的种子只对同 arch + 同 macOS
#      大类有效。这里用 macos-latest，也就是当前要支持的组合。
#   3. 本仓库是公开仓库，Actions 的标准 macOS runner 不计费；而且它的网络
#      比开发机快几个数量级 —— 本地实测下载 dpkg 一个包要 4 分钟。
#
# 这个工作流是**手动触发**的：它要编译 2019 年的 C 代码，耗时以十分钟计，
# 而且只在「要验证自举」或「要出新种子」时才需要跑。PR 上的 verify.yml
# 不碰它。
#
# 产物：
#   bootstrap.log          完整日志，失败时先看这里
#   essential-debs.tar     编出来的 .deb，也就是种子的原料
#   finx-seed/             自举成功时打出的种子与清单，可直接喂给
#                          install.sh --seed-dir=<解开的目录>
#
# 种子不是 .deb 池的重新打包，而是**装好的前缀的快照** —— 安装器拿到后只做
# 解包、归一权限、重签 Mach-O、写配置、重建索引。理由与取舍见
# scripts/make_seed.sh 的注释。

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Install prefix. Must be /opt/finx for a usable seed."
        required: false
        default: "/opt/finx"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-latest
    # 首次自举要编译 dpkg、tar、bzip2、gettext、libiconv、ncurses、binutils…
    # 给足余量；卡住时能靠 timeout 而不是靠人盯着。
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Report the environment
        run: |
          set -euo pipefail
          echo "arch   = $(uname -m)"
          echo "darwin = $(uname -r)"
          echo "macOS  = $(sw_vers -productVersion)"
          xcodebuild -version | head -2
          /usr/bin/perl -v | sed -n '2p'
          echo "make   = $(/usr/bin/make --version | head -1)"
          echo "pod2man: $(ls -l /usr/bin/pod2man 2>&1)"
          # 这台机器能不能自举，取决于 check_host 认不认 Darwin 版本。
          # 把它打出来，免得失败时还要猜是环境问题还是代码问题。

      - name: Show how bootstrap will judge this host
        run: |
          set -euo pipefail
          make test_setup ARCHITECTURE="$(uname -m)" >/dev/null
          PERL5LIB=perlmod /usr/bin/perl -Iperlmod -e '
              require Fink::Bootstrap;
              my $host = `./update/config.guess`; chomp $host;
              my $d = Fink::Bootstrap::check_host($host, 1, shift);
              print "host         = $host\n";
              print "distribution = $d\n";
              print "tree         = ", Fink::Bootstrap::get_selfupdatetrees($d), "\n";
          ' "$(uname -m)"

      - name: Run bootstrap
        # 逻辑全在 scripts/ci_bootstrap.sh 里，CircleCI 调同一个脚本。
        # 这里只保留一句：为什么重试，以及为什么用 .sudo。
        #
        #   .sudo      —— bootstrap:272 把第一个以 "." 开头的参数当作 rootmethod，
        #                 这正是它提权重启自己时的写法；显式给出就不依赖 stdin 默认值。
        #   为什么重试 —— master 镜像 distfiles.master.finkmirrors.net 是轮询 DNS，
        #                 节点里有长期死掉的（如 distfiles.yeg.ab.ca.finkmirrors.net
        #                 直接解析失败）。挑中死节点时 curl 退出码 6，Fink 弹「怎么继续」
        #                 菜单，而 stdin 是 /dev/null 会立刻取默认值「Give up」——
        #                 网络抖动于是变成致命失败。
        run: |
          set -euo pipefail
          scripts/ci_bootstrap.sh "${{ inputs.prefix }}" 5

      - name: Collect the built packages
        if: always()
        run: |
          set -uo pipefail
          PREFIX="${{ inputs.prefix }}"
          # dpkg 把成品放在 %p/finx/debs（符号链接指向 buildpath 里的实物）。
          # 用 find -L 跟过去，拿到真实文件。
          if [ -d "$PREFIX/finx/debs" ]; then
              mkdir -p essential-debs
              sudo find -L "$PREFIX/finx/debs" -maxdepth 1 -name '*.deb' \
                  -exec cp {} essential-debs/ \; 2>/dev/null || true
              sudo chown -R "$(id -u):$(id -g)" essential-debs || true
          fi
          count=$(ls -1 essential-debs 2>/dev/null | wc -l | tr -d ' ')
          echo "collected $count .deb"
          ls -l essential-debs 2>/dev/null | head -20

      - name: Summarise where it stopped
        if: always()
        run: |
          set -uo pipefail
          echo "### bootstrap log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -50 bootstrap.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 哪一步停的，一眼可见：这些是 bootstrap 自己的阶段标题。
          echo "### phases reached" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'BOOTSTRAP PHASE|Checks?ing system|Distribution:|bootstrap exited' bootstrap.log \
              >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-log
          path: bootstrap.log
          if-no-files-found: warn

      - name: Upload the built packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-debs
          path: essential-debs/
          if-no-files-found: warn

      - name: Summarise the installed prefix
        if: always()
        run: |
          set -uo pipefail
          PREFIX="${{ inputs.prefix }}"
          echo "### prefix layout" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
              echo "-- top level --"
              sudo du -sh "$PREFIX"/* 2>/dev/null | sort -k2
              echo "-- fink/debs --"
              sudo ls -ld "$PREFIX/fink/debs" 2>/dev/null
              echo "-- dpkg --"
              sudo ls "$PREFIX/var/lib/dpkg/" 2>/dev/null
              sudo sh -c "wc -l < $PREFIX/var/lib/dpkg/status" 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the seed
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.prefix }}"
          # 前缀里的文件归 root，打包含义上也要读全（有的目录是 700），所以用 sudo。
          # 打完把产物交还给 runner，否则 upload-artifact 读不到。
          sudo ./scripts/make_seed.sh --prefix "$PREFIX" --out seed
          sudo chown -R "$(id -u):$(id -g)" seed
          echo "### seed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat seed/manifest >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h seed/seed.tar.gz

      - name: Upload the seed
        uses: actions/upload-artifact@v4
        with:
          name: finx-seed
          path: |
            seed/seed.tar.gz
            seed/manifest
          if-no-files-found: error
