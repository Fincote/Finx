name: Bootstrap

# 在真 macOS 上跑一次完整的 ./bootstrap，把 essential 包编出来。
#
# 为什么在这里跑而不是在别的机器上：
#
#   1. dpkg / tar 用 --build=%m-apple-darwin 编译，产物是 Mach-O，链的是
#      macOS 的 libSystem。Linux 上编出来的是 ELF，装进 Mac 上一行都跑不起来
#      —— 所以那台 Ubuntu 22.04 的服务器只能当镜像，不能当构建机。
#   2. 种子里的 .deb 路径是写死的（--with-admindir=%p/...、dylib 的
#      install_name 是绝对路径），一台机器编的种子只对同 arch + 同 macOS
#      大类有效。这里用 macos-latest，也就是当前要支持的组合。
#   3. 本仓库是公开仓库，Actions 的标准 macOS runner 不计费；而且它的网络
#      比开发机快几个数量级 —— 本地实测下载 dpkg 一个包要 4 分钟。
#
# 这个工作流是**手动触发**的：它要编译 2019 年的 C 代码，耗时以十分钟计，
# 而且只在「要验证自举」或「要出新种子」时才需要跑。PR 上的 verify.yml
# 不碰它。
#
# 产物：
#   bootstrap.log          完整日志，失败时先看这里
#   essential-debs.tar     编出来的 .deb，也就是种子的原料
#
# 种子打包本身还没做（见 docs/TECHNICAL-GUIDE.md 8.3 / 8.8）。在那之前，
# 这个工作流的作用是回答一个问题：这份树到底能不能从源码装起来。

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Install prefix. Must be /opt/finx for a usable seed."
        required: false
        default: "/opt/finx"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-latest
    # 首次自举要编译 dpkg、tar、bzip2、gettext、libiconv、ncurses、binutils…
    # 给足余量；卡住时能靠 timeout 而不是靠人盯着。
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Report the environment
        run: |
          set -euo pipefail
          echo "arch   = $(uname -m)"
          echo "darwin = $(uname -r)"
          echo "macOS  = $(sw_vers -productVersion)"
          xcodebuild -version | head -2
          /usr/bin/perl -v | sed -n '2p'
          echo "make   = $(/usr/bin/make --version | head -1)"
          echo "pod2man: $(ls -l /usr/bin/pod2man 2>&1)"
          # 这台机器能不能自举，取决于 check_host 认不认 Darwin 版本。
          # 把它打出来，免得失败时还要猜是环境问题还是代码问题。

      - name: Show how bootstrap will judge this host
        run: |
          set -euo pipefail
          make test_setup ARCHITECTURE="$(uname -m)" >/dev/null
          PERL5LIB=perlmod /usr/bin/perl -Iperlmod -e '
              require Fink::Bootstrap;
              my $host = `./update/config.guess`; chomp $host;
              my $d = Fink::Bootstrap::check_host($host, 1, shift);
              print "host         = $host\n";
              print "distribution = $d\n";
              print "tree         = ", Fink::Bootstrap::get_selfupdatetrees($d), "\n";
          ' "$(uname -m)"

      - name: Run bootstrap
        # 两个参数，顺序不能换：
        #   .sudo      —— 第一个参数以 "." 开头时被当作 rootmethod（见
        #                 bootstrap:272）。这正是脚本提权重启自己时传的写法，
        #                 显式给出来就不必依赖 stdin 的默认值。
        #   /opt/finx  —— 安装前缀（bootstrap:503 的 shift）。
        #
        # stdin 重定向到 /dev/null：configure() 的每个提问读到 EOF 时返回空串，
        # 空串一律取默认值 —— 这就是无人值守的机制，不需要改 Fink。
        # 已在 finx-install/README.md 记录并实测过。
        #
        # 用 sudo 而不是让 bootstrap 自己提权：runner 上的 sudo 免密，而
        # bootstrap 的提权分支会从 /dev/tty 读密码，CI 里没有终端。
        #
        # 为什么要重试：master 镜像是个轮询 DNS（distfiles.master.finkmirrors.net），
        # 它的节点里有长期死掉的（例如 distfiles.yeg.ab.ca.finkmirrors.net，直接
        # 解析失败）。挑中死节点时 curl 退出码 6，Fink 弹出「怎么继续」菜单 ——
        # 而 stdin 是 /dev/null，EOF 取默认值「Give up」，于是网络抖动变成致命失败。
        # 第一次实测就是这样：同一份代码，13:45 那轮下载成功，13:55 那轮全灭。
        #
        # 重试是安全的：tarball 落在 $PREFIX/src，cmd_fetch_missing 会跳过已有的，
        # 所以每一轮都从断点继续，不会重下。
        run: |
          set -uo pipefail
          PREFIX="${{ inputs.prefix }}"
          echo "bootstrap into $PREFIX"
          sudo -n true || { echo "FAILED: passwordless sudo unavailable"; exit 1; }

          ATTEMPTS=5
          rc=1
          for n in $(seq 1 "$ATTEMPTS"); do
              echo "==== attempt $n of $ATTEMPTS ===="
              # 必须显式 set +e：GitHub Actions 的 run: 默认是 bash -e，
              # 而这里的 set -uo pipefail 只增不减。少了这两行，bootstrap
              # 一旦失败整个脚本立刻退出，下面的重试逻辑根本不会执行 ——
              # 上一轮就是这样：日志里连 "attempt 1 failed ... retrying" 都没有。
              set +e
              sudo ./bootstrap .sudo "$PREFIX" < /dev/null 2>&1 \
                  | tee -a bootstrap.log
              rc=${PIPESTATUS[0]}
              set -e
              if [ "$rc" -eq 0 ]; then
                  echo "==== attempt $n succeeded ===="
                  break
              fi
              # 只在一轮里确实出现过下载失败时才重试；其它错误（编译失败等）
              # 重试也没用，只会把真正的错误埋在五份日志里。
              # 注意匹配的是失败行，不是「Downloading the file」（那行成功时也出现）。
              if ! tail -300 bootstrap.log | grep -qE 'Downloading the file .* failed'; then
                  echo "==== attempt $n failed and it was not a download problem; not retrying ===="
                  break
              fi
              echo "==== attempt $n failed on a download; retrying ===="
              sleep 5
          done

          echo "---- bootstrap exited $rc ----"
          tail -40 bootstrap.log
          exit "$rc"

      - name: Collect the built packages
        if: always()
        run: |
          set -uo pipefail
          PREFIX="${{ inputs.prefix }}"
          # dpkg 把成品放在 %p/fink/debs（符号链接指向 buildpath 里的实物）。
          # 用 find -L 跟过去，拿到真实文件。
          if [ -d "$PREFIX/fink/debs" ]; then
              mkdir -p essential-debs
              sudo find -L "$PREFIX/fink/debs" -maxdepth 1 -name '*.deb' \
                  -exec cp {} essential-debs/ \; 2>/dev/null || true
              sudo chown -R "$(id -u):$(id -g)" essential-debs || true
          fi
          count=$(ls -1 essential-debs 2>/dev/null | wc -l | tr -d ' ')
          echo "collected $count .deb"
          ls -l essential-debs 2>/dev/null | head -20

      - name: Summarise where it stopped
        if: always()
        run: |
          set -uo pipefail
          echo "### bootstrap log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -50 bootstrap.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 哪一步停的，一眼可见：这些是 bootstrap 自己的阶段标题。
          echo "### phases reached" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'BOOTSTRAP PHASE|Checks?ing system|Distribution:|bootstrap exited' bootstrap.log \
              >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-log
          path: bootstrap.log
          if-no-files-found: warn

      - name: Upload the built packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-debs
          path: essential-debs/
          if-no-files-found: warn
